hero:
  title: Наталья<br><span class="italic grad-text">Охочинская</span>
  lead: |-
    Певица, педагог по эстрадному и джазовому вокалу, актриса и музыкальный
    наставник. Руководитель вокальной школы «Звук N».
  meta:
    - label: Образование
      value: СПбГУКИ · эстрадно-джазовое пение
    - label: Практика
      value: Сцена, запись, концерты
    - label: Школа
      value: «Звук N», Санкт-Петербург
story:
  eyebrow: История
  title: От сцены в три года<br>до своей <span class="italic">школы</span>
  image: assets/img/portrait.jpg
  imageAlt: Наталья Охочинская
  text1: >-
    Наталья родилась в музыкальной семье: её отец — певец и радиоведущий Юрий
    Охочинский.

    Первый выход на большую сцену состоялся, когда Наташе было три года, и уже тогда было

    понятно, что она пойдёт по его стопам.
  text2: >-
    Музыкальная школа по классу фортепиано, собственные написанные песни, грезы
    о карьере

    певицы. В 15 лет — театральная студия и новая страсть: театр. Затем поступление в

    театральный институт и полтора года учёбы. В какой-то момент Наталья решает оставить

    карьеру актрисы ради музыки — и поступает на факультет музыкального искусства эстрады,

    специальность «эстрадно-джазовое пение».
  text3: >-
    Дальше шли записи авторских песен и творческие поиски, а потом мечта собрать
    команду

    и много выступать: так появился проект LYCHEE. Сегодня Наталья руководит собственной

    вокальной школой «Звук N», ведёт индивидуальные и групповые занятия и готовит учеников

    к сцене — от первого микрофона до отчётного концерта.
  quote:
    text: «Музыка — это язык души.»
    author: Наталья Охочинская
timeline:
  eyebrow: Путь
  title: Из чего<br>сложился <span class="italic grad-text">педагог</span>
  items:
    - dt: 3 года
      dd: >-
        Первый выход на большую сцену. Музыкальная семья, дома всегда пели —
        голос

        был частью жизни раньше, чем появились первые уроки.
    - dt: Детство
      dd: >-
        Музыкальная школа по классу фортепиано. Начали писать свои песни и
        мечтать

        о большой сцене.
    - dt: 15 лет
      dd: >-
        Театральная студия и открытие для себя театра. Затем поступление в
        театральный

        институт и полтора года обучения.
    - dt: Институт
      dd: >-
        Выбор в пользу музыки: факультет музыкального искусства эстрады,
        специальность

        «эстрадно-джазовое пение», высшее музыкальное образование.
    - dt: Сцена
      dd: >-
        Записи авторских песен, собственный вокальный проект и постоянные
        выступления —

        живой опыт, который не выключается во время урока.
    - dt: Сегодня
      dd: |-
        Вокальная школа «Звук N»: занятия, отчётные концерты учеников на террасе
        Zarenkov Gallery и курс «Твой голос».
approach:
  eyebrow: Подход
  title: Что стоит<br>за каждым <span class="italic">уроком</span>
  cards:
    - number: "01"
      title: Голос, который остаётся вашим
      text: >-
        Не ставлю чужую постановку и не делаю из всех один голос. Работаем с
        тем,

        что у вас уже есть: тембром, диапазоном, характером звучания — и расширяем это.
    - number: "02"
      title: Сначала тело, потом звук
      text: >-
        Каждое занятие начинается с разминки, дыхания и снятия зажимов. Пока
        плечи

        и горло держат голос — техника не появится.
    - number: "03"
      title: Без страха оценки
      text: >-
        Небольшая группа и спокойный темп помогают перестать бояться чужого
        мнения.

        Это то, из-за чего многие годами не берут микрофон в руки.
    - number: "04"
      title: Сцена как часть программы
      text: >-
        Занятия не заканчиваются в комнате. Отчётные концерты школы —
        естественное

        продолжение работы, а не экзамен.
