      caption: Вывеска

# ---------- 02. Форматы и цены ----------
formats:
  title: 'Как<br>заниматься'
  aside: >-
    Начать можно с личного урока, с короткого группового курса или с формата
    для детей. Расписание и количество занятий подбираем под вашу задачу — от
    постановки голоса до подготовки конкретной песни.
  # У блоков варианта 3 появился ярлык (tag), у первой карточки — другой текст,
  # у блока с курсом — заливка (fill)
  cards:
    - number: '01'
      tag: Индивидуально
      title: Личный урок
      text: >-
        Программа целиком строится под ваш голос, задачу и репертуар: подготовка
        песни, студийная запись или выход на сцену.
      bullets:
        - Диагностика голоса и разбор задачи
        - Дыхание, опора, диапазон, тембр
        - Работа над выбранной песней
      price: по запросу
      priceNote: за урок
      priceSmall: true
      linkText: Узнать стоимость
      linkHref: /kontakty#zayavka
    - number: '02'
      tag: Набор открыт
      fill: true
      title: Курс «Твой голос»
      text: >-
        Шесть встреч за три недели в небольшой группе: съёмка прогресса,
        работа со своим материалом и финальное выступление.
      bullets:
        - 6 занятий по 90 минут, среда и суббота
        - Видеосъёмка на первом и финальном уроке
        - Сертификат и мини-концерт
      price: 11 900 ₽
      priceNote: за курс
      priceSmall: false
      linkText: Программа курса
      linkHref: /zanyatiya#program
    - number: '03'
      tag: Дети
      title: Дети от 4 лет
      text: >-
        Отдельный формат: слух, ритм, свободное движение и радость от собственного
        звука — без давления и без экзаменов.
      bullets:
        - Игровая форма и распевки под фортепиано
        - Чистое интонирование и чувство ритма
        - Выступления на концертах школы
      price: по запросу
      priceNote: за урок
      priceSmall: true
      linkText: Узнать стоимость
      linkHref: /kontakty#zayavka

