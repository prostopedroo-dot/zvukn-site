  image: assets/img/portrait.jpg
  imageAlt: Наталья Охочинская — педагог по вокалу
  labels:
    - Вокальная школа
    - Санкт-Петербург
    - Крыша с видом на город
  # Третья строка заголовка (первые две — общие, из home.yaml)
  titleLine3: Звучи.
  lead: >-
    Эстрадный и джазовый вокал с Натальей Охочинской. Без чужих постановок
    и без страха оценки — ваш тембр, ваши песни, ваша сцена.
  buttons:
    - text: Записаться на занятие
      href: /kontakty#zayavka
      style: ''
    - text: Форматы и стоимость
      href: /zanyatiya
      style: btn--out
  # Билет-плашка на фотографии
  ticket:
    kick: Курс «Твой голос»
    price: 11 900 ₽
    sub: 6 занятий · 3 недели
    time: 'ср и сб · 18:00–19:30'
    duration: 90 мин

# ---------- 01. О педагоге ----------
about:
  # Номер раздела выводится отдельно от подписи (в вариантах 1–2 он в подписи)
  idx: '01'
  label: О педагоге
  title: 'Не бойтесь<br>своего голоса'
  list:
    - Эстрадный и джазовый вокал, работа с фортепиано
    - Высшее музыкальное образование и действующая сцена
    - Отчётные концерты учеников на террасе галереи
