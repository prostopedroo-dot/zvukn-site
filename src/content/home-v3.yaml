# ГЛАВНАЯ, ВАРИАНТ 3 — «Афиша» — только ОТЛИЧИЯ от home.yaml.
# Всё, чего здесь нет, сборка берёт из home.yaml автоматически.
# Важно: если отличается хотя бы один пункт списка (одна строка, одна
# фотография), список указывается здесь целиком — сборка заменяет список.
# Разметка в текстах: <br> перенос, <span class="it gold">золотой курсив</span>.

description: 'Вокальная школа «Звук N» в центре Петербурга: эстрадный и джазовый вокал, индивидуальные занятия и курс «Твой голос», сцена, запись песен, отчётные концерты. Ул. Социалистическая, 21.'

