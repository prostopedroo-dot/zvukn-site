program:
  label: 03 — Программа
  title: Шесть встреч<br><span class="it gold">за три недели</span>
  aside: "От снятия зажимов до собственного звучания. Расписание фиксированное:
    среда и суббота, 18:00–19:30."
  steps:
    - number: "01"
      title: Свободное тело = свободный звук
      text: "Работа с телом и дыханием для снятия мышечных зажимов: телесная разминка,
        дыхательные и вокальные упражнения, начало работы с репертуаром."
    - number: "02"
      title: Опора. Уверенное звучание
      text: Навык опоры звука через работу с диафрагмой. Дыхательные и вокальные
        упражнения на опору, репертуар для ровного звучания.
    - number: "03"
      title: Страхи и зажимы вокалиста
      text: "Преодоление психологических барьеров: упражнения на дыхание и распевки,
        групповое пение и импровизация, запись и прослушивание исполнения."
    - number: "04"
      title: Индивидуальное звучание
      text: "Развитие и управление уникальным тембром: анализ своего тембра через
        запись, упражнения с резонаторами и атакой звука, творческие задания."
    - number: "05"
      title: Ритм, интонация и слух
      text: "Чувство ритма и чистота интонирования: работа с ритмами и метрономом,
        пропевание и угадывание интервалов, разбор аккордов."
    - number: "06"
      title: Завершение курса
      text: Разминка, выступления участников с разбором, исполнение общей песни,
        вручение сертификатов и обратная связь.
