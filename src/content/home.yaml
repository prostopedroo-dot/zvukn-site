about:
  text1: "Наталья родилась в музыкальной семье: отец — певец и радиоведущий Юрий
    Охочинский. Первый выход на большую сцену состоялся в три года, и с тех пор
    музыка оставалась языком, на котором ей проще всего говорить."
  text2: Музыкальная школа по классу фортепиано, театральная студия с 15 лет,
    затем высшее образование на факультете музыкального искусства эстрады и
    специальность «эстрадно-джазовое пение». Сегодня — собственная школа «Звук
    N», запись песен, сцена и ученики, которые впервые берут микрофон в руки.
  linkHref: /o-pedagoge
  linkText: Полная биография
  imageAlt: Наталья Охочинская — педагог по вокалу
  label: 01 — О педагоге
  title: Певица, которая<br>учит <span class="it gold">не бояться</span><br>своего
    голоса
  image: assets/img/portrait.jpg
  list:
    - Эстрадный и джазовый вокал, работа с фортепиано
    - Высшее музыкальное образование, работающая сцена
    - Отчётные концерты учеников на террасе галереи
  imageTag: Наталья Охочинская
quote:
  text: «Музыка — это <span class="gold">язык души</span>.»
  author: Наталья Охочинская · руководитель школы
