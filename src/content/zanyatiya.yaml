# ---------- Как проходит курс ----------
course:
  eyebrow: Что происходит
  title: 'Курс «Твой голос»<br>за <span class="italic grad-text">три недели</span>'
  lead: >-
    6 занятий по 90 минут, среда и суббота. На первом и финальном занятии —
    видеосъёмка, чтобы вы увидели изменения. Финал: мини-выступления, сертификаты и
    тёплое завершение.
  cards:
    - label: Формат
      title: Небольшая группа
      text: Все успевают пропеться, получить обратную связь и поработать со своим материалом.
    - label: Ритм
      title: Среда и суббота
      text: Занятия в одно и то же время, 18:00–19:30. Три недели — короткий и понятный цикл.
    - label: Итог
      title: Сцена и сертификат
      text: Видеосъёмка прогресса, мини-выступления, разбор и вручение сертификатов.

# ---------- Программа курса (якорь #program) ----------
program:
  eyebrow: Программа
  title: 'Темы<br><span class="italic">занятий</span>'
  lead: >-
    Шесть встреч: от снятия зажимов до собственного звучания и финального
    выступления.
  steps:
    - title: Свободное тело = свободный звук
      text: >-
        Работа с телом и дыханием для снятия мышечных зажимов: телесная разминка,
        дыхательные и вокальные упражнения, начало работы с репертуаром.
    - title: Опора. Уверенное звучание
      text: >-
        Навык опоры звука через работу с диафрагмой. Дыхательные и вокальные упражнения
        на опору, репертуар для ровного звучания.
    - title: Страхи и зажимы вокалиста
      text: >-
        Преодоление психологических барьеров: упражнения на дыхание и распевки,
        групповое пение и импровизация, запись и прослушивание исполнения.
    - title: Индивидуальное звучание
      text: >-
        Развитие и управление уникальным тембром: анализ своего тембра через запись,
        упражнения с резонаторами и атакой звука, творческие задания.
    - title: Ритм, интонация и слух
      text: >-
        Чувство ритма и чистота интонирования: работа с ритмами и метрономом,
        пропевание и угадывание интервалов, разбор аккордов.
    - title: Завершение курса
      text: >-
        Разминка, выступления участников с разбором, исполнение общей песни,
        вручение сертификатов и обратная связь.

# ---------- Как начать ----------
start:
  eyebrow: Как начать
  title: 'Четыре<br><span class="italic grad-text">шага</span>'
