# ---------- Частые вопросы ----------
faq:
  eyebrow: Коротко о важном
  title: 'Частые<br><span class="italic grad-text">вопросы</span>'
  items:
    - q: Можно прийти без опыта?
      a: >-
        Да. Курс подходит тем, кто хочет начать мягко, без давления и страха оценки.
        Опыт не требуется: первые занятия — про тело, дыхание и знакомство со своим голосом.
    - q: Нужно ли уметь петь?
      a: >-
        Нет. Чистый слух и поставленный голос — это то, над чем мы работаем, а не условие входа.
        Если сомневаетесь в себе, это как раз повод прийти.
    - q: Будет ли внимание каждому в группе?
      a: >-
        Группа намеренно небольшая. На каждом занятии есть работа с каждым участником:
        разбор голоса, обратная связь и корректировка упражнений под вас.
    - q: Как проходит оплата?
      a: >-
        После заявки куратор свяжется с вами, ответит на вопросы и подскажет следующий шаг.
        Оплата проходит после подтверждения места в группе.
    - q: Что если пропущу занятие?
      a: >-
        Предупредите заранее — мы подскажем, как отработать материал. Расписание курса
        фиксированное (среда и суббота), поэтому лучше планировать посещение заранее.
    - q: Где проходят занятия?
      a: >-
        Санкт-Петербург, ул. Социалистическая, 21 — апарт-отель Ye's на Марата, 10 этаж,
        пространство Zarenkov Gallery. Ближайшие станции — «Звенигородская» и «Социалистическая».
    - q: Есть ли занятия для детей?
      a: >-
        Да, есть отдельный формат для детей от 4 лет: музыкальный слух, ритм, фортепиано
        и распевки в игровой форме. Возраст и расписание уточняйте при записи.

