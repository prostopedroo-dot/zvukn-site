# Юридический текст: владелец может править каждый блок по отдельности.
# Блоки документа идут строго по порядку, типы:
#   heading — подзаголовок раздела;
#   text    — абзац (можно с разметкой: <b>жирный</b>, <br> перенос строки);
#   list    — список (каждый пункт с новой строки через «-»).

title: 'Политика конфиденциальности — вокальная школа «Звук N», Санкт-Петербург'
description: 'Политика обработки персональных данных посетителей сайта вокальной школы «Звук N» Натальи Охочинской: какие данные собираются, зачем и как их защищают.'

# ---------- Первый экран ----------
hero:
  breadcrumb: Политика конфиденциальности
  title: 'Политика<br><span class="italic grad-text">конфиденциальности</span>'
  lead: >-
    Как мы обращаемся с персональными данными посетителей сайта.
    Документ составлен по требованиям Федерального закона № 152-ФЗ «О персональных данных».

# ---------- Текст документа ----------
doc:
  - type: heading
    text: 1. Общие положения
  - type: text
    text: >-
      1.1. Настоящая Политика определяет порядок обработки и защиты персональных данных посетителей сайта
      вокальной школы «Звук N» (далее — Сайт), а также определяет права и обязанности посетителя и оператора.
  - type: text
    text: >-
      1.2. Оператором персональных данных является <b>Наталья Охочинская</b>, самозанятый
      (плательщик налога на профессиональный доход), ИНН <span class="ph">____________</span>.
  - type: text
    text: >-
      1.3. Политика разработана в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных».
  - type: text
    text: 1.4. Оператор не требует регистрации на Сайте и не создаёт личных кабинетов.
  - type: text
    text: >-
      1.5. Отправляя заявку через форму на Сайте, посетитель подтверждает согласие с условиями настоящей Политики.
      Если посетитель не согласен с ними, он может не использовать форму и написать оператору напрямую в мессенджере.

  - type: heading
    text: 2. Какие данные обрабатываются
  - type: text
    text: >-
      2.1. Посетитель самостоятельно вводит в форме заявки на Сайте: имя, номер телефона, ник в Telegram,
      желаемый формат занятий и свободный текст вопроса. Указывать данные необязательно, кроме имени.
  - type: text
    text: >-
      2.2. Эти данные <b>не отправляются на сервер Сайта и не хранятся в его базах данных</b>: форма формирует
      текст сообщения и открывает мессенджер Telegram. Передача сведений происходит напрямую между посетителем
      и оператором в мессенджере и регулируется правилами Telegram.
  - type: text
    text: >-
      2.3. Хостинг-провайдер Сайта может обрабатывать технические данные, необходимые для его работы
      (IP-адрес, тип браузера и устройства, время посещения) — в журналах посещений.
  - type: text
    text: >-
      2.4. На Сайте используется встроенная карта Яндекса. Она может устанавливать собственные файлы cookie
      и передавать технические данные сервисам Яндекса. Рекламные и аналитические cookie Сайт не использует.

  - type: heading
    text: 3. Цели обработки данных
  - type: list
    items:
      - связь с посетителем по заявке и ответы на вопросы;
      - подбор формата и времени занятия, запись на занятие;
      - выполнение договора на оказание услуг;
      - информирование о занятиях и событиях школы по обращению посетителя.
  - type: text
    text: >-
      3.1. Правовым основанием обработки является согласие посетителя (статья 9 Федерального закона № 152-ФЗ)
      и заключаемый с ним договор на оказание услуг.
  - type: text
    text: 3.2. Специальные категории персональных данных и биометрические данные Сайт не собирает и не обрабатывает.

  - type: heading
    text: 4. Передача третьим лицам
  - type: text
    text: >-
      4.1. Оператор не продаёт и не передаёт персональные данные третьим лицам, за исключением случаев,
      предусмотренных законодательством Российской Федерации.
  - type: text
    text: >-
      4.2. Данные могут обрабатываться сервисами, обеспечивающими работу Сайта и связи: мессенджером Telegram —
      по выбору посетителя при отправке заявки; сервисами Яндекса — при работе встроенной карты;
      хостинг-провайдером — в объёме, необходимом для технического обслуживания Сайта.
  - type: text
    text: >-
      4.3. Оператор вправе передать данные третьим лицам только в случаях и объёме, которые предусмотрены
      законом, либо с письменного согласия посетителя.

  - type: heading
    text: 5. Сроки хранения
  - type: text
    text: >-
      5.1. Данные хранятся в переписке в мессенджере в течение срока, необходимого для связи с посетителем
      и исполнения договора на оказание услуг.
  - type: text
    text: 5.2. По достижении целей обработки данные удаляются по запросу посетителя.

  - type: heading
    text: 6. Права посетителя
  - type: text
    text: 'Посетитель имеет право:'
  - type: list
    items:
      - получить сведения об обработке своих персональных данных;
      - требовать уточнения, блокирования или уничтожения неполных, неточных или незаконно обработанных данных;
      - отозвать согласие на обработку данных в любой момент (статья 9 Федерального закона № 152-ФЗ);
      - обжаловать действия оператора в Роскомнадзоре или в судебном порядке.
  - type: text
    text: >-
      6.1. Запросы направляются оператору любым удобным способом контактов, указанных в разделе 9,
      в порядке, исключающем передачу лишних персональных данных. Ответ предоставляется в срок,
      установленный законодательством.

  - type: heading
    text: 7. Меры защиты данных
  - type: text
    text: 7.1. Сайт работает по защищённому протоколу HTTPS.
  - type: text
    text: 7.2. Обмен сообщениями с посетителем происходит в мессенджере по защищённым каналам.
  - type: text
    text: >-
      7.3. Оператор не публикует и не распространяет персональные данные посетителей без их согласия
      и ограничивает доступ к переписке только теми сотрудниками, которые участвуют в оказании услуг.
  - type: text
    text: >-
      7.4. Принимаются организационные меры защиты от неправомерного доступа, уничтожения, изменения
      и распространения таких данных.

  - type: heading
    text: 8. Изменение условий
  - type: text
    text: >-
      8.1. Актуальная редакция Политики размещена на этой странице. Дата последнего обновления —
      <span data-policy-date>29 сентября 2026 г.</span>
  - type: text
    text: >-
      8.2. В случае существенных изменений условий оператор публикует новую редакцию с указанием даты
      и уведомляет посетителей, чьи данные находятся в обработке.

  - type: heading
    text: 9. Реквизиты и контакты оператора
  - type: text
    class: doc-contacts
    text: >-
      <b>Наталья Охочинская</b><br>
      вокальная школа «Звук N», Санкт-Петербург<br>
      самозанятая (плательщик НПД), ИНН <span class="ph">____________</span><br>
      Адрес: Санкт-Петербург, ул. Социалистическая, 21, Ye's на Марата, 10 этаж<br>
      Telegram: <a href="https://t.me/natlyone" target="_blank" rel="noopener">@natlyone</a>
  - type: text
    class: muted
    text: >-
      Вопросы об обработке персональных данных можно задать в Telegram — это самый быстрый
      и безопасный способ: сообщение не попадёт на публичную почту.

