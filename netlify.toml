# Настройки для хостинга Netlify: как собирать сайт при каждом обновлении.
# Обычно менять не нужно.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Панель управления: вход по почте и паролю через Netlify Identity.
# Файлы панели лежат в папке admin и копируются в сборку автоматически.
