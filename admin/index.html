<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель управления сайтом — Звук N</title>
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<meta name="robots" content="noindex">
<style>
  /* Кнопка выхода в панели — внизу справа, чтобы не мешать «Опубликовать» */
  #zvukn-logout {
    position: fixed; right: 18px; bottom: 18px; z-index: 99999;
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,.14);
    background: rgba(255,255,255,.94); color: #333;
    font: 500 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  #zvukn-logout:hover { background: #fff; }
</style>
</head>
<body>
<!--
  Панель управления сайтом вокальной школы «Звук N».
  Здесь владелец меняет тексты, фотографии и цены — без программиста.
  Вход: по адресу сайта + /admin/ (например https://zvukn-school.netlify.app/admin/),
  логин и пароль выдаются отдельно.
  Настройки полей — в файле admin/config.yml.
-->
<script>
  // Ссылки из писем Netlify (вход, сброс пароля, приглашение) ведём на страницу
  // входа — там всегда открывается форма нового пароля.
  (function () {
    var hash = window.location.hash || "";
    if (/(recovery|invite|confirmation|email_change)_token=/.test(hash)) {
      window.location.replace("/admin/account.html" + hash);
    }
  })();
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
<script>
  // Кнопка «Войти» на самой панели (если открыли её напрямую).
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
<script>
  // Кнопка «Выйти» прямо в панели: видна, только когда кто-то вошёл.
  (function () {
    if (!window.netlifyIdentity) return;
    var btn = document.createElement("button");
    btn.id = "zvukn-logout";
    btn.type = "button";
    btn.textContent = "Сменить аккаунт";
    btn.title = "Выйти и войти другим аккаунтом";
    btn.style.display = "none";
    btn.addEventListener("click", function () {
      btn.textContent = "Меняем…";
      try { netlifyIdentity.logout(); } catch (e) {}
      try { localStorage.removeItem("gotrue.user"); } catch (e) {}
      setTimeout(function () { window.location.href = "/admin/account.html"; }, 600);
    });
    function sync() {
      var u = null;
      try { u = netlifyIdentity.currentUser(); } catch (e) {}
      btn.style.display = u ? "block" : "none";
      btn.textContent = "Сменить аккаунт";
    }
    netlifyIdentity.on("init", sync);
    netlifyIdentity.on("login", sync);
    netlifyIdentity.on("logout", sync);
    document.body.appendChild(btn);
    sync();
  })();
</script>
</body>
</html>
