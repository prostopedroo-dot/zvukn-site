<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход и пароль редактора — Звук N</title>
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<meta name="robots" content="noindex">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #14100d; color: #f3ece3;
    font: 16px/1.6 -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .box { width: min(470px, 92vw); padding: 32px; border: 1px solid rgba(243,236,227,.18); border-radius: 14px; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  p  { margin: 0 0 16px; color: rgba(243,236,227,.72); font-size: 14.5px; }
  label { display: block; margin: 14px 0 6px; font-size: 13px; color: rgba(243,236,227,.8); }
  input {
    width: 100%; padding: 11px 13px; border-radius: 9px; font-size: 15px;
    border: 1px solid rgba(243,236,227,.22); background: rgba(255,255,255,.05); color: #f3ece3;
  }
  input:focus { outline: 2px solid #c8a35c; outline-offset: 1px; }
  button {
    margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 999px;
    background: #f3ece3; color: #14100d; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: #c8a35c; border: 1px solid rgba(200,163,92,.5); margin-top: 10px; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 16px; font-size: 14px; min-height: 22px; }
  .ok { color: #9fd8a8; }
  .err { color: #e89a8a; }
  .who { margin-top: 4px; font-size: 13.5px; color: rgba(243,236,227,.62); }
  a { color: #c8a35c; }
  hr { border: 0; border-top: 1px solid rgba(243,236,227,.14); margin: 24px 0 18px; }
</style>
</head>
<body>
<div class="box">
  <h1>Вход для редактора</h1>
  <div class="who" id="who">Проверяем…</div>

  <!-- Вход -->
  <form id="loginForm" hidden>
    <hr />
    <p>Введите почту и пароль.</p>
    <label for="email">Почта</label>
    <input id="email" type="email" autocomplete="username" placeholder="ваша почта">
    <label for="pass">Пароль</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button type="submit" id="loginBtn">Войти</button>
    <button type="button" class="ghost" id="forgot">Прислать ссылку для входа (забыли пароль)</button>
    <button type="button" class="ghost" id="toSignup">Создать новый аккаунт</button>
  </form>

  <!-- Создание аккаунта -->
  <form id="signupForm" hidden>
    <hr />
    <p>Для нового редактора. Придумайте пароль — сразу, без писем.</p>
    <label for="sEmail">Почта</label>
    <input id="sEmail" type="email" autocomplete="username" placeholder="ваша почта">
    <label for="sPass">Пароль</label>
    <input id="sPass" type="password" autocomplete="new-password">
    <label for="sPass2">Повторите пароль</label>
    <input id="sPass2" type="password" autocomplete="new-password">
    <button type="submit" id="signupBtn">Создать аккаунт</button>
    <button type="button" class="ghost" id="toLogin">Назад ко входу</button>
  </form>

  <!-- Новый пароль: по ссылке из письма или при входе после приглашения -->
  <form id="passForm" hidden>
    <hr />
    <p id="passText">Придумайте пароль — он понадобится вам для входа в панель.</p>
    <label for="p1">Новый пароль</label>
    <input id="p1" type="password" autocomplete="new-password">
    <label for="p2">Повторите пароль</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button type="submit" id="passBtn">Сохранить пароль</button>
  </form>

  <div id="msg" class="msg"></div>

  <p class="who" style="margin-top:22px">
    Панель управления: <a href="/admin/">/admin/</a>
  </p>
</div>

<script>
  /* Сначала забираем ссылку из письма — ДО загрузки виджета Netlify.
     Раньше окно нового пароля открывал сам виджет и оно могло не показаться;
     теперь форма всегда открывается здесь, на этой странице. */
  window.__linkToken = (function () {
    var raw = (window.location.hash || "") + "&" + (window.location.search || "");
    var m = raw.match(/(recovery|invite|confirmation|email_change)_token=([^&"']+)/);
    if (!m) return null;
    try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
    return { type: m[1], token: m[2] };
  })();
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  var who = document.getElementById("who");
  var loginForm = document.getElementById("loginForm");
  var signupForm = document.getElementById("signupForm");
  var passForm = document.getElementById("passForm");
  var msg = document.getElementById("msg");
  var link = window.__linkToken;
  var linkedUser = null;

  function show(text, kind) {
    msg.className = "msg " + (kind || "");
    msg.textContent = text || "";
  }

  function errText(err) {
    if (!err) return "ошибка";
    if (err.json && err.json.msg) return err.json.msg;
    if (err.json && err.json.error_description) return err.json.error_description;
    if (err.json && err.json.error) return err.json.error;
    if (err.message) return err.message + (err.status ? " (код " + err.status + ")" : "");
    return String(err);
  }

  function current() {
    try { return netlifyIdentity.currentUser(); } catch (e) { return null; }
  }

  /* Виджет Netlify готов не сразу: сначала он узнаёт настройки сайта.
     Ждём этого момента, иначе вызовы ниже падают с ошибкой. */
  var apiReady = !!(window.netlifyIdentity && netlifyIdentity.gotrue);
  var waiting = [];
  function whenReady(fn) {
    if (apiReady || (window.netlifyIdentity && netlifyIdentity.gotrue)) {
      apiReady = true;
      fn();
      return;
    }
    waiting.push(fn);
  }
  function fireReady() {
    apiReady = true;
    var q = waiting.slice();
    waiting.length = 0;
    q.forEach(function (fn) { fn(); });
  }
  if (window.netlifyIdentity) {
    netlifyIdentity.on("init", function () { fireReady(); });
    if (netlifyIdentity.gotrue) fireReady();
  }

  function render(user) {
    user = user || linkedUser || current();
    if (user && user.email) {
      who.innerHTML = "Вы вошли как: <b>" + user.email + "</b>";
      passForm.hidden = false;
      loginForm.hidden = true;
      signupForm.hidden = true;
    } else {
      who.textContent = "Вы ещё не вошли.";
      loginForm.hidden = false;
      passForm.hidden = true;
      signupForm.hidden = true;
    }
  }

  /* ---------- вход по ссылке из письма ---------- */
  function openLink() {
    if (link.type === "recovery") {
      who.textContent = "Открываем ссылку из письма…";
      show("Проверяем ссылку…", "");
      netlifyIdentity.gotrue.recover(link.token, true)
        .then(function (user) {
          linkedUser = user;
          render(user);
          show("Ссылка подошла. Придумайте новый пароль ниже.", "ok");
        })
        .catch(function (err) {
          render();
          show("Ссылка уже не работает — она устарела или её уже открывали. "
             + "Нажмите «Прислать ссылку для входа»: придёт новая (если сразу не пришла, подождите пару минут).", "err");
        });
      return;
    }

    if (link.type === "invite") {
      who.textContent = "Пришло приглашение в редакторы.";
      passForm.hidden = false;
      loginForm.hidden = true;
      signupForm.hidden = true;
      document.getElementById("passText").textContent = "Придумайте пароль для нового редактора — и можно входить в панель.";
      show("Приглашение принято, осталось задать пароль.", "ok");
      return;
    }

    /* подтверждение почты или смена почты */
    netlifyIdentity.gotrue.verify(link.type, link.token, true)
      .then(function () {
        link = null;
        render();
        show("Готово, почта подтверждена. Теперь войдите почтой и паролем.", "ok");
      })
      .catch(function (err) {
        link = null;
        render();
        show("Ссылка не сработала: " + errText(err), "err");
      });
  }

  function boot() {
    if (!link) {
      netlifyIdentity.on("init", function (user) { render(user); });
      if (netlifyIdentity && netlifyIdentity.gotrue) render();
      return;
    }
    whenReady(openLink);
  }
  boot();

  /* ---------- кнопки на форме входа ---------- */
  document.getElementById("toSignup").addEventListener("click", function () {
    loginForm.hidden = true;
    signupForm.hidden = false;
    show("");
  });
  document.getElementById("toLogin").addEventListener("click", function () {
    signupForm.hidden = true;
    loginForm.hidden = false;
    show("");
  });

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("pass").value;
    if (!email || !password) { show("Заполните почту и пароль.", "err"); return; }
    show("Проверяем…", "");
    whenReady(function () {
      netlifyIdentity.gotrue.login(email, password, true)
        .then(function () { return netlifyIdentity.refresh(); })
        .then(function () { render(); show("Вы вошли. Можно открывать панель: /admin/", "ok"); })
        .catch(function (err) { show("Не получилось: " + errText(err), "err"); });
    });
  });

  document.getElementById("forgot").addEventListener("click", function () {
    var email = document.getElementById("email").value.trim();
    if (!email) { show("Введите почту, чтобы прислать ссылку.", "err"); return; }
    show("Отправляем письмо…", "");
    whenReady(function () {
      netlifyIdentity.gotrue.requestPasswordRecovery(email)
        .then(function () { show("Письмо отправлено на " + email + ". Откройте ссылку из него — она откроет эту страницу.", "ok"); })
        .catch(function (err) { show("Не получилось: " + errText(err), "err"); });
    });
  });

  document.getElementById("signupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("sEmail").value.trim();
    var p1 = document.getElementById("sPass").value;
    var p2 = document.getElementById("sPass2").value;
    if (!email) { show("Введите почту.", "err"); return; }
    if (!p1) { show("Введите пароль.", "err"); return; }
    if (p1 !== p2) { show("Пароли не совпадают.", "err"); return; }
    if (p1.length < 8) { show("Пароль слишком короткий — минимум 8 символов.", "err"); return; }
    show("Создаём…", "");
    whenReady(function () {
      netlifyIdentity.gotrue.signup(email, p1)
        .then(function () { return netlifyIdentity.refresh(); })
        .then(function () { render(); show("Аккаунт создан. Можно открывать панель: /admin/", "ok"); })
        .catch(function (err) { show("Не получилось: " + errText(err), "err"); });
    });
  });

  /* ---------- сохранение нового пароля ---------- */
  document.getElementById("passForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var p1 = document.getElementById("p1").value;
    var p2 = document.getElementById("p2").value;
    if (!p1) { show("Введите пароль.", "err"); return; }
    if (p1 !== p2) { show("Пароли не совпадают.", "err"); return; }
    if (p1.length < 8) { show("Пароль слишком короткий — минимум 8 символов.", "err"); return; }
    show("Сохраняем…", "");

    /* Приглашение принимается вместе с паролем, остальное — обычной сменой пароля. */
    var step;
    if (link && link.type === "invite") {
      step = netlifyIdentity.gotrue.acceptInvite(link.token, p1, true)
        .then(function (user) { link = null; linkedUser = user; return null; });
    } else {
      var user = linkedUser || current();
      if (!user || !user.token) { show("Сеанс истёк. Откройте ссылку из письма заново или войдите.", "err"); return; }
      step = Promise.resolve(user.token.jwt()).then(function (jwt) {
        return fetch("/.netlify/identity/user", {
          method: "PUT",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + jwt },
          body: JSON.stringify({ password: p1, password_confirm: p2 })
        }).then(function (r) {
          return r.json().then(function (body) {
            if (!r.ok) throw new Error((body && (body.msg || body.error_description || body.error)) || ("код " + r.status));
            return body;
          });
        });
      });
    }

    step.then(function () {
        show("Пароль сохранён! Теперь входите в панель: /admin/ — почта и этот пароль.", "ok");
        who.textContent = "Пароль сохранён. Войдите в панель ниже.";
        linkedUser = null;
        loginForm.hidden = false;
        passForm.hidden = true;
        signupForm.hidden = true;
        document.getElementById("p1").value = "";
        document.getElementById("p2").value = "";
      })
      .catch(function (err) { show("Не получилось: " + errText(err), "err"); });
  });

  /* Если регистрация закрыта — прячем кнопку создания аккаунта. */
  whenReady(function () {
    netlifyIdentity.gotrue.settings().then(function (s) {
      if (s && s.disable_signup) document.getElementById("toSignup").hidden = true;
    }).catch(function () {});
  });
</script>
</body>
</html>
